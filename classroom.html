<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classroom</title>
  <style>
    .container {
      display: grid;
      gap: 12px;
      height: 100vh;
      grid-template-columns: 1fr 2fr;
    }
    .box {
      border: 2px solid #000;
      border-radius: 10px;
      width: 550px;
      height: 350px;
    }
    .box:hover {
      transform: scale(1.04);
      transition: transform 0.3s;
      z-index: 1.02;
    }
    .box img {
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }
    @media (max-width: 600px) {
      .container {
        grid-template-columns: 1fr;
      }
      .box {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>
  <h1>Welcome to the Classroom</h1>
  <div class="container">
    <div class="box"><img src="assets/image/ChatGPT Image Jan 8, 2026, 10_51_06 PM.png" alt="picture" width="100%"></div>
    <div class="box"><img src="assets/image/open-magic-book-with-fantasy-blue-light-vector_107791-31843.avif" alt="picture"></div>
    <div class="box"><img src="assets/image/Creativity+and+art.webp" alt="picture"></div>
    <div class="box"><img src="assets/image/bird-8788491_1280 (1).jpg" alt="picture"></div>
  </div>
</body>
</html>
