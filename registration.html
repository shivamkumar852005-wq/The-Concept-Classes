<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        body{
           min-height: 100vh;
           display: flex;
           justify-content: center;
           align-items: center;
           background:rgb(7, 112, 116) ;
           padding: 20px;
        }
        .container{
            position: relative;
            max-width: 700px;
            background: white;
            padding: 20px ;
            border-radius: 9px;
        }
        .container h3{
            text-align: center;
            font-weight:500 ;
            font-size: 1.5rem;
        }
        .container div{
            margin: 13px;
        }
    </style>
</head>
<body>
 <section class="container"">
     <form>
        <h3> REGISTRATION FORM</h3>
        <div class="input-box">
         <label for="username">Enter your name</label>
         <input type="text" id="username" placeholder=" enter your name">
        </div>
        <div>
         <label for="DOB">Date Of Birth</laabel>
         <input type="date" id="DOB" placeholder="Date Of Birth">
        </div>
        <div>
         <label for="email">Enter Your Email</label>
         <input type="email" id="email" placeholder="your email">
       </div>
       <div>
         <label for="ad">Address</label>
         <input type="tel" id="ad" placeholder="address">
        </div>
        <div>
         <label for="mob">Mobile Number</label>
         <input type="number" id="mob" placeholder="mobile number">
        </div>
        <div>
         <label for="pmob"> Parrents Number</label>
         <input type="number" id="pmob" placeholder="mobile number">
        </div>
      <div>
         YOUR 10<sup>th</sup> DIVISION<br>
         <label for="divi">first</label>
         <input type="radio" id="divi" value="first" name="division">
        
         <label for="di">second</label>
         <input type="radio" id="di" value="second" name="division">
        
         <label for="d">third</label>
         <input type="radio" id="d" value="third" name="division">
        </div>
        <div>
            Gender:
           <label for="gender">Male</label>
           <input type="checkbox" id="gender" value="male"  name="gender">
           <label for="GENDER">Femail</label>
           <input type="checkbox"  id="GENDER" value="femail" name="gender">
           <label for="Gnder">Other</label>
           <input type="checkbox"  id="Gender" value="Other" name="gender">
       </div>
        <input type="submit" placeholder="submit" style="background-color: rgb(85, 202, 17);">
     </form>
  </section>
</body>
</html>
